<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardita Pages</title>

    <link rel="stylesheet" href="style.css" />
    <!-- bootstrap via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- navbar start -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top shadow">
      <div class="container p-3">
        <a class="navbar-brand" href="#">AR Page</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Project</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- navbar end -->
    <section id="home" class="home">
      <div class="container">
        <div class="row align-items-center justify-content-center g-4">
          <div class="col-md-6 col-10 text-md-start text-center">
            <h3>Welcome to Ardita Profile</h3>
            <p class="text-muted">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt
              itaque error nesciunt. Consectetur, et nam cum magnam itaque fugit
              sequi!
            </p>
            <a href="#" class="btn btn-success">Contact</a>
          </div>
          <div class="col-md-4 col-8 d-flex justify-content-center">
            <img
              src="img/profil.jpg"
              alt="profil"
              class="img-fluid"
              style="max-width: 250px"
            />
          </div>
        </div>
      </div>
    </section>
    <!-- about -->
    <section id="about" class="about">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-lg-8 mt-3">
            <h3 class="fw-bold">About Me</h3>
          </div>
        </div>
      </div>
    </section>

    <!-- javascript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
